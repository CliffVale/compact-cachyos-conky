--[[
  CachyOS Conky — CachyOS brand, GPU bar, zram, load, power, procs
]]

conky.config = {
    alignment = 'top_right',
    gap_x = 15,
    gap_y = 10,
    minimum_width = 270,
    maximum_width = 270,
    default_color = 'cdd6f4',
    color1 = '89b4fa',
    color2 = 'a6e3a1',
    color3 = 'cba6f7',
    color4 = 'f9e2af',
    color5 = 'a6adc8',
    color6 = 'fab387',
    color7 = 'f38ba8',
    background = true,
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = false,
    own_window_colour = '1e1e2e',
    own_window_hints = 'below,undecorated,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    use_xft = true,
    xftalpha = 0.9,
    font = 'DejaVu Sans:size=9',
    uppercase = false,
    update_interval = 3,
    no_buffers = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    override_utf8_locale = true,
    border_width = 1,
    border_inner_margin = 8,
    border_outer_margin = 5,
};

conky.text = [[
${font DejaVu Sans:bold:size=8}${color #89b4fa} CACHYOS${color}${font} ${color #585b70}${kernel}${color}${alignr}${color #585b70}${uptime_short}${color}
${color #585b70}Load: ${loadavg}${color}

${font DejaVu Sans:size=9}${color5}CPU${color} ${color1}${cpu}%${color} ${alignr}${color #585b70}C0:${color1}${cpu cpu1}%${color #585b70} C1:${color1}${cpu cpu2}%${color #585b70} C2:${color1}${cpu cpu3}%${color #585b70} C3:${color1}${cpu cpu4}%${color}
${cpubar 3,240}

${font DejaVu Sans:size=9}${color5}RAM${color} ${color2}${memperc}%${color} ${color2}${mem}${color} ${alignr}${color #585b70}ZRAM: ${execi 30 ~/.local/bin/zram-stats}${color}
${membar 3,240}

${font DejaVu Sans:size=9}${color5}GPU${color} ${color3}${exec nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader 2>/dev/null | xargs | cut -d' ' -f1}%${color}${alignr}· ${color #585b70}VRAM: ${color3}${exec nvidia-smi --query-gpu=memory.used --format=csv,noheader 2>/dev/null | xargs | cut -d' ' -f1}${color #585b70}/${color3}4096 MiB${color #585b70} PWR: ${color3}${exec nvidia-smi --query-gpu=power.draw --format=csv,noheader 2>/dev/null | xargs}${color}
${execibar 3 ~/.local/bin/gpu-util}

${font DejaVu Sans:size=9}${color5}DISK${color} ${color6}${fs_used_perc /}%${color} ${alignr}${color6}${fs_used /}${color #585b70}/${color6}${fs_size /}${color}
${fs_bar 3,240 /}

${font DejaVu Sans:size=9}${color5}NET${color}${alignr}${color #585b70}D: ${color4}${downspeedf wlan0}${color #585b70} (${color4}${totaldown wlan0}${color #585b70})  U: ${color4}${upspeedf wlan0}${color #585b70} (${color4}${totalup wlan0}${color})
${downspeedgraph wlan0 10,115 313244 89b4fa} ${upspeedgraph wlan0 10,115 313244 a6e3a1}
${voffset 4}${color #585b70}CPU: ${color}${exec sensors coretemp-isa-0000 2>/dev/null | awk '/Package/{print $4}' | tr -d + | cut -d. -f1 | xargs}°C${color #585b70}  GPU: ${color}${exec nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader 2>/dev/null | xargs}°C${color #585b70}  SSD: ${color}${exec sensors nvme-pci-0200 2>/dev/null | awk '/Composite/{print $2}' | tr -d + | cut -d. -f1 | xargs}°C

${font DejaVu Sans:size=8}${color #585b70}${top name 1}${alignr}${top cpu 1}% ${top mem 1}%${color}
${font DejaVu Sans:size=8}${color #585b70}${top name 2}${alignr}${top cpu 2}% ${top mem 2}%${color}
${font DejaVu Sans:size=8}${color #585b70}${top name 3}${alignr}${top cpu 3}% ${top mem 3}%${color}
${color #585b70}Procs: ${color}${execi 60 ps aux | wc -l}${alignr}${color #585b70}${freq_g 1} GHz${color}
]];
